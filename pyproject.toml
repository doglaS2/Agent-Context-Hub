[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ctx"
version = "0.1.0"
description = "Local-first State Handover engine for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Douglas Siqueira", email = "doug.siq.silva@gmail.com" },
]
dependencies = [
    "typer>=0.15,<1",
    "pydantic>=2.10,<3",
    "rich>=14,<16",
]

[project.optional-dependencies]
# Dashboard local (`agent-ctx ui`). Extra opcional: a CLI base segue leve.
ui = [
    "fastapi>=0.112,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
agent-ctx = "agent_ctx.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# Assets do dashboard viajam dentro do wheel; sem isto o `ui` quebra após
# `pip install` (os diretórios simplesmente não existiriam no pacote).
[tool.setuptools.package-data]
"agent_ctx.ui" = ["static/*.css", "templates/*.html"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
