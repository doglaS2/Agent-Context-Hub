<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgentContext Hub{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='tailwind.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module">
        const root = document.documentElement;
        function applyTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                root.classList.add('dark');
            } else {
                root.classList.remove('dark');
            }
        }
        function toggleTheme() {
            root.classList.toggle('dark');
            localStorage.theme = root.classList.contains('dark') ? 'dark' : 'light';
        }
        window.toggleTheme = toggleTheme;
        applyTheme();
    </script>
</head>
<body>
    <!-- ───── Gradient glow blob (ambient) ───── -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] rounded-full opacity-20 blur-[120px] pointer-events-none z-0" style="background: linear-gradient(135deg, var(--gradient-from), var(--gradient-to));"></div>

    <!-- ───── Navbar ───── -->
    <nav class="sticky top-0 z-50 border-b border-[var(--border-subtle)]" style="background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, var(--gradient-from), var(--gradient-to));">
                    <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <span class="text-[15px] font-semibold tracking-tight">AgentContext Hub</span>
            </a>
            <div class="flex items-center gap-4">
                <div class="tag-pill hidden sm:inline-flex">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Local
                </div>
                <button type="button" onclick="window.toggleTheme()" class="theme-toggle" aria-label="Alternar tema"></button>
            </div>
        </div>
    </nav>

    <!-- ───── Content ───── -->
    <main class="relative z-10 max-w-5xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>

    <!-- ───── Footer ───── -->
    <footer class="relative z-10 border-t border-[var(--border-subtle)] mt-20">
        <div class="max-w-5xl mx-auto px-6 py-8 flex items-center justify-between text-xs text-[var(--text-muted)]">
            <span>AgentContext Hub v0.1.0</span>
            <span>Local-first State Handover</span>
        </div>
    </footer>
</body>
</html>
